services:
  camera-wall:
    build: .
    image: truenas-camera-wall:local
    restart: unless-stopped
    environment:
      CAMERA_WALL_CONFIG: /config/config.yaml
      OUTPUT_URL: ${OUTPUT_URL:-rtsp://192.168.64.10:8554/camera_wall}
      CAMERA_WALL_BITRATE: ${CAMERA_WALL_BITRATE:-5M}
      CAMERA_WALL_ENCODER: ${CAMERA_WALL_ENCODER:-software}
      CAMERA_WALL_VAAPI_QP: ${CAMERA_WALL_VAAPI_QP:-23}
      CAMERA_WALL_INPUT_HWACCEL: ${CAMERA_WALL_INPUT_HWACCEL:-software}
      CAMERA_WALL_WEB_ENABLED: ${CAMERA_WALL_WEB_ENABLED:-true}
      CAMERA_WALL_WEB_PORT: ${CAMERA_WALL_WEB_PORT:-8088}
      CAMERA_WALL_ADMIN_USER: ${CAMERA_WALL_ADMIN_USER:-admin}
      CAMERA_WALL_ADMIN_PASSWORD: ${CAMERA_WALL_ADMIN_PASSWORD}
      CAMERA_WALL_LOG_BUFFER_LINES: ${CAMERA_WALL_LOG_BUFFER_LINES:-500}
      CAMERA_WALL_GPU_STATS_ENABLED: ${CAMERA_WALL_GPU_STATS_ENABLED:-true}
      CAMERA_WALL_GPU_DEVICE: ${CAMERA_WALL_GPU_DEVICE:-/dev/dri/renderD128}
      CAMERA_WALL_GPU_SAMPLE_SECONDS: ${CAMERA_WALL_GPU_SAMPLE_SECONDS:-5}
      CAMERA_WALL_INPUT_PREFLIGHT_ENABLED: ${CAMERA_WALL_INPUT_PREFLIGHT_ENABLED:-true}
      CAMERA_WALL_INPUT_PREFLIGHT_TIMEOUT: ${CAMERA_WALL_INPUT_PREFLIGHT_TIMEOUT:-5}
      CAMERA_WALL_INPUT_REPROBE_SECONDS: ${CAMERA_WALL_INPUT_REPROBE_SECONDS:-30}
      CAMERA_1_URL: ${CAMERA_1_URL}
      CAMERA_2_URL: ${CAMERA_2_URL}
      CAMERA_3_URL: ${CAMERA_3_URL}
    volumes:
      - ./config.yaml:/config/config.yaml
    ports:
      - "${CAMERA_WALL_WEB_PORT:-8088}:${CAMERA_WALL_WEB_PORT:-8088}"
    devices:
      - /dev/dri:/dev/dri
