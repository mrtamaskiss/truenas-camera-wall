<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camera Wall Admin</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Camera Wall</h1>
        <span id="configState" class="state-pill">Loading</span>
      </div>
      <div class="actions">
        <span id="ffmpegState" class="state-pill">FFmpeg</span>
        <button id="restartButton" type="button" class="secondary">Restart</button>
        <button id="saveButton" type="button">Save &amp; Apply</button>
      </div>
    </header>

    <main class="workspace">
      <section class="output-section">
        <div class="section-heading">
          <h2>Output</h2>
        </div>
        <div id="outputForm" class="form-grid"></div>
      </section>

      <section class="layout-section">
        <div class="section-heading">
          <h2>Layout</h2>
          <div class="layout-tools">
            <select id="layoutSelect" aria-label="Layout template">
              <option value="auto">Auto</option>
              <option value="three">3 wall</option>
              <option value="two-by-two">2x2</option>
              <option value="five">5 wall</option>
              <option value="grid">Grid</option>
              <option value="focus">Focus</option>
            </select>
            <button id="applyLayoutButton" type="button" class="secondary">Apply Layout</button>
          </div>
        </div>
        <div class="preview-wrap">
          <div id="preview" class="preview" aria-label="Layout preview"></div>
        </div>
      </section>

      <section class="status-section">
        <div class="section-heading">
          <h2>Status</h2>
          <div class="status-tools">
            <button id="testOutputButton" type="button" class="secondary">Test Output</button>
            <button id="testGpuButton" type="button" class="secondary">Test GPU</button>
            <button id="refreshLogsButton" type="button" class="secondary">Refresh</button>
            <button id="copyCommandButton" type="button" class="secondary">Copy Command</button>
            <button id="downloadConfigButton" type="button" class="secondary">Download Config</button>
          </div>
        </div>
        <div id="statusGrid" class="status-grid"></div>
        <div id="inputHealthPanel" class="input-health"></div>
        <div id="diagnosticsPanel" class="diagnostics-panel"></div>
        <pre id="commandBox" class="command-box"></pre>
        <pre id="logPanel" class="log-panel"></pre>
      </section>

      <section class="camera-section">
        <div class="section-heading">
          <h2>Cameras</h2>
          <button id="addCameraButton" type="button" class="secondary">Add Camera</button>
        </div>
        <div id="cameraList" class="camera-list"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
